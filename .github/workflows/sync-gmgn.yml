name: Refresh GMGN observation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmgn-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project and pinned GMGN CLI
        run: |
          npm ci
          npm install --global gmgn-cli@1.5.6

      - name: Configure GMGN API key
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: gmgn-cli config --apply "$GMGN_API_KEY"

      - name: Aggregate wallet activity
        env:
          GMGN_CLIENTS_JSON: ${{ secrets.GMGN_CLIENTS_JSON }}
        run: npm run sync:gmgn

      - name: Validate updated ledger
        run: npm run check

      - name: Upload validated ledger
        uses: actions/upload-artifact@v4
        with:
          name: gmgn-ledger
          path: public/data/ledger.json
          if-no-files-found: error

  commit:
    runs-on: ubuntu-latest
    needs: refresh
    permissions:
      contents: write
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated ledger
        uses: actions/download-artifact@v4
        with:
          name: gmgn-ledger
          path: public/data

      - name: Commit public aggregate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ledger.json
          if git diff --cached --quiet; then
            echo "No GMGN aggregate changes"
          else
            git commit -m "data: refresh GMGN wallet activity"
            git push origin HEAD:main
          fi
